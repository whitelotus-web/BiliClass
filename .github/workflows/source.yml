name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYDANTIC_DISABLE_PLUGINS: '__all__'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-check dependencies (no voice models)
        run: >-
          python -m pip install "pytest>=8,<10" "ruff>=0.11,<1"
          "PySide6-Essentials>=6.8,<7" "pydantic>=2.10,<3" "fastapi>=0.115,<1"
          "websockets>=14,<17" "httpx>=0.28,<1" "cryptography>=50,<51"
          "psutil>=6,<8" "python-pptx>=1,<2" "python-docx>=1.1,<2"
          "pypdf>=6,<7" "qrcode[pil]>=8,<9" "pywin32>=308,<400" "numpy>=1.26,<3" "scipy>=1.13,<2"
      - run: python -m ruff check app scripts tests
      - run: python -m compileall -q app scripts
      - name: Portable storage, cache and narration contracts
        run: >-
          python -m pytest -q tests/test_backup_safety.py tests/test_library_location.py
          tests/test_narration_preparation.py tests/test_narration_workspace.py
          tests/test_office_tasks.py tests/test_lesson_state.py tests/test_narration_preferences.py
          tests/test_support_report.py tests/test_slide_dependency_cache.py
          tests/test_slide_render_cache.py
          tests/test_download_names.py tests/test_presentation_audio.py
          tests/test_slideshow_shortcuts.py tests/test_teaching_session.py tests/test_english_reader.py
          tests/test_ui_watchdog.py tests/test_narration_status.py tests/test_speech_process.py
          tests/test_voice_pairs.py
          tests/test_library_actions.py tests/test_library_bulk.py
          tests/test_completed_export.py tests/test_lesson_location.py tests/test_office_retry.py
          tests/test_batch_jobs.py tests/test_batch_inputs.py
          tests/test_library_view.py tests/test_chemical_translation.py
          tests/test_spoken_chemistry.py tests/test_picture_translation.py
      - name: Fixture corpus (structural; no Office)
        run: python -m scripts.verify_quality_corpus
